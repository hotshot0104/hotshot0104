# ---------------------------------------------------------------
#  GitHub Action: Pac-Man Contribution Graph Animation
# ---------------------------------------------------------------
#  This workflow generates an animated Pac-Man game SVG over your
#  GitHub contribution graph and pushes it to the `output` branch.
# ---------------------------------------------------------------

name: Generate Pac-Man Contribution Graph

on:
  # Runs automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allows manual trigger from Actions tab
  workflow_dispatch:

  # Runs on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
