name: Daily Contribution

on:
  schedule:
    - cron: "30 0 * * *"

  # Manual trigger
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update contribution log
        run: |
          mkdir -p logs
          echo "📅 $(date -u '+%Y-%m-%d %H:%M:%S UTC') — Auto contribution" >> logs/daily-log.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/daily-log.txt
          git commit -m "📈 Daily contribution — $(date -u '+%Y-%m-%d')"
          git push
