# ---------------------------------------------------------------
#  GitHub Action: Daily Auto-Contribution
# ---------------------------------------------------------------
#  Keeps your GitHub contribution streak alive by making a small
#  automated commit once every day.
#
#  SETUP:
#  1. Push this file to your repo's main branch.
#  2. Go to repo Settings → Actions → General → Workflow permissions
#     and enable "Read and write permissions".
#  3. The workflow runs daily at 00:30 UTC (6:00 AM IST).
#     You can also trigger it manually from the Actions tab.
# ---------------------------------------------------------------

name: Daily Contribution

on:
  schedule:
    # Runs once daily at 00:30 UTC (6:00 AM IST)
    - cron: "30 0 * * *"

  # Manual trigger
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update contribution log
        run: |
          mkdir -p logs
          echo "📅 $(date -u '+%Y-%m-%d %H:%M:%S UTC') — Auto contribution" >> logs/daily-log.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/daily-log.txt
          git commit -m "📈 Daily contribution — $(date -u '+%Y-%m-%d')"
          git push
