# ---------------------------------------------------------------
#  GitHub Action: Generate Profile Summary Cards
# ---------------------------------------------------------------
#  Generates GitHub stats cards as SVGs and pushes them to the
#  repo so they load directly from GitHub (no external services).
# ---------------------------------------------------------------

name: Generate Profile Cards

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "output"
          UTC_OFFSET: 5.5
