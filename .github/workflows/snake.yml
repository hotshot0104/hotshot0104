# ---------------------------------------------------------------
#  GitHub Action: Contribution Snake Animation
# ---------------------------------------------------------------
#  This workflow generates an SVG snake animation from your
#  GitHub contribution graph and pushes it to the `output` branch.
#
#  SETUP INSTRUCTIONS:
#  1. In your GitHub profile repo (hotshot0104/hotshot0104),
#     create the directory:  .github/workflows/
#  2. Save this file as:    .github/workflows/snake.yml
#  3. Push to your `main` branch.
#  4. The action will run automatically every 12 hours,
#     or you can trigger it manually from the Actions tab.
#  5. The generated SVGs are pushed to a branch called `output`.
#     Your README already points to that branch.
# ---------------------------------------------------------------

name: Generate Contribution Snake

on:
  # Runs automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

  # Also runs on every push to main (keeps it fresh)
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # --------------------------------------------------
      # Step 1: Generate the snake SVGs
      # --------------------------------------------------
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # --------------------------------------------------
      # Step 2: Push generated files to the `output` branch
      # --------------------------------------------------
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
